<!doctype html>
<!--
This HTML is a web front-end for AValAnCHE. It offers a read-only view into the running instance, and is intended to be
served by AValAnCHE itself, which will only ever serve this file, plus a live feed of events. Because of this setup, all
JavaScript, SVG, and CSS is bundled in this file as well.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>AValAnCHE</title>
    <style>
        html, body, h1 {
            margin: 0;
            padding: 0;
            color: #222;
        }

        h1 {
        }

        body {
            font-family: 'Proxima Nova', sans-serif;
            font-size: 16px;
        }

        nav {
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        nav, main {
            padding: 22px;
        }

        #logo {
            display: inline;
            vertical-align: sub;
        }

        #stats {
            float: right;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        th {
            font-weight: normal;
            text-align: right;
        }

        td {
            font-weight: bold;
            padding-right: 1em;
            text-align: right;
        }

        #text, pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: small;
            overflow: scroll;
        }

        #columns {
            display: grid;
            grid-auto-flow: column;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        #text, #findings {
        }

        #findings {
            padding-left: 30px;
        }

        .muted {
            color: gray;
        }

        pre {
            background-color: #eee;
            padding: 12px;
            border-radius: 2px;
            white-space: pre-wrap;
            font-size: 12px;
        }

        summary {
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
    </style>
</head>

        </div>

    </nav>
    <main>
        <div id="status">
            <p>Loading&hellip;</p>
            <p class="muted">Test inputs will appear here as they are attempted. (If they do not, check console output.)</p>
        </div>
        <div id="columns">
            <div id="text"></div>
            <div id="findings">
            </div>
        </div>
    </main>
    <template id="finding">
        <h2></h2>


    </template>
    <script>
        function $(id) {
            return document.querySelector(id);
        }

        const events = new EventSource("/events");

        events.onmessage = (msg) => {
            var data = JSON.parse(msg.data)
            $('#status').innerText = ''
            $('#text').innerText = `/* ${data.lang} */ ${data.text}`
            $('#total').innerText = data.stats.total
            $('#probes').innerText = data.stats.probes
            $('#covered').innerText = data.stats.covered
            $('#find').innerText = ((Number(data.stats.now) - Number(data.stats.find)) / 1000).toFixed(1) + 's ago'
            $('#boot').innerText = ((Number(data.stats.now) - Number(data.stats.boot)) / 1000).toFixed(0) + 's'
            $('#avg').innerText = (Number(data.stats.total) / ((Number(data.stats.now) - Number(data.stats.boot)) / 1000)).toFixed(2)

            if (data.findings === {}) {
                $('#findings').innerHTML = ''
            }

            for (const [k, v] of Object.entries(data.findings)) {
                let f = document.getElementById(k)
                if (f) {
                    const s = f.querySelector('summary')

                    s.innerText = v.count + 'x: ' + v.message.replaceAll('\n', ' ')
                } else {
                    f = document.createElement('details')

                    const s = document.createElement('summary')

                    const x = document.createElement('pre')
                    const t = document.createElement('pre')

                    s.innerText = v.count + 'x: ' + v.message.replaceAll('\n', ' ')
                    x.innerText = v.stack
                    t.innerText = v.text

                    f.appendChild(s)
                    f.appendChild(x)
                    f.appendChild(t)
                    f.setAttribute('id', k)

                    $('#findings').appendChild(f)
                }
            }
        }

        events.onerror = (event) => {
            $('#status').innerText = 'An error occurred. Check console output.'
            $('#text').innerText = ''
        }
    </script>
